<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Grid</title>
<style>
body{font-family:Arial; margin:20px; background:#f4f4f4}
h1{text-align:center}
.gallery{display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px; max-width:900px; margin:auto}
.gallery img{width:100%; height:200px; object-fit:cover; border-radius:10px; box-shadow:0 2px 5px #aaa}
@media(max-width:600px){.gallery{grid-template-columns:1fr 1fr}}
</style></head><body>
<h1>Photo Gallery - 9 Images (display: grid)</h1>
<div class="gallery">
<img src="https://picsum.photos/id/1015/400/300" alt="Nature 1">
<img src="https://picsum.photos/id/1016/400/300" alt="Nature 2">
<img src="https://picsum.photos/id/1025/400/300" alt="Nature 3">
<img src="https://picsum.photos/id/1035/400/300" alt="Nature 4">
<img src="https://picsum.photos/id/1043/400/300" alt="Nature 5">
<img src="https://picsum.photos/id/1062/400/300" alt="Nature 6">
<img src="https://picsum.photos/id/1074/400/300" alt="Nature 7">
<img src="https://picsum.photos/id/1084/400/300" alt="Nature 8">
<img src="https://picsum.photos/id/1080/400/300" alt="Nature 9">
</div>
</body></html>
