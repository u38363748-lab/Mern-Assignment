<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Grid Areas</title>
<style>
body{margin:0; font-family:Arial}
.dashboard{display:grid; grid-template-columns:200px 1fr; grid-template-rows:60px 1fr 50px; grid-template-areas:"header header" "sidebar main" "footer footer"; height:100vh; gap:10px; background:#f0f0f0}
.header{grid-area:header; background:#2c3e50; color:white; display:flex; align-items:center; padding-left:20px}
.sidebar{grid-area:sidebar; background:#34495e; color:white; padding:20px}
.main{grid-area:main; background:white; padding:20px; border-radius:8px}
.footer{grid-area:footer; background:#2c3e50; color:white; display:flex; align-items:center; justify-content:center}
</style></head><body>
<div class="dashboard">
<div class="header"><h2>Dashboard Header</h2></div>
<div class="sidebar"><p>Sidebar</p><p>Home</p><p>Profile</p><p>Settings</p></div>
<div class="main"><h1>Main Content</h1><p>Ye layout grid-template-areas se bana hai.</p><p>grid-area, fr units, gap sab use hua hai.</p></div>
<div class="footer">Footer - Umair Beg MERN Assignment</div>
</div>
</body></html>
